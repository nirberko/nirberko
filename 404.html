<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page not found</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
  <style>
    body { margin: 0; background: #121211; color: #e9e6df; font-family: "Newsreader", Georgia, serif; text-align: center; }
    main { max-width: 640px; margin: 0 auto; padding: 128px 20px; }
    h1 { font-weight: 400; font-size: 2.4rem; margin: 0; }
    p { font-style: italic; color: #7f7b73; font-size: 1.15rem; }
    a { color: #b9b5ac; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a id="home" href="/">Back to the home page</a></p>
  </main>
  <script>
    // Works both at the site root (custom domain) and under /nirberko/ on github.io.
    if (location.pathname.startsWith("/nirberko/")) document.getElementById("home").href = "/nirberko/";
  </script>
</body>
</html>
